<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JHarness2 - AI Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #1a1a2e; --surface: #16213e; --surface2: #0f3460;
            --primary: #4fc3f7; --primary-dark: #0288d1; --text: #e0e0e0;
            --text-muted: #9e9e9e; --border: #2a3a5e; --danger: #ef5350;
            --success: #66bb6a; --tool-bg: #1b2838; --radius: 10px;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 16px; font-size: 14px; transition: all .2s; }
        button:hover { opacity: .85; }
        input { border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; font-size: 14px; background: var(--surface); color: var(--text); outline: none; width: 100%; }
        input:focus { border-color: var(--primary); }

        /* Auth */
        #auth-view { display: flex; align-items: center; justify-content: center; height: 100vh; }
        .auth-card { background: var(--surface); padding: 40px; border-radius: var(--radius); width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
        .auth-card h2 { text-align: center; margin-bottom: 24px; color: var(--primary); }
        .auth-card .field { margin-bottom: 16px; }
        .auth-card .field label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-muted); }
        .auth-card .btn-primary { width: 100%; padding: 12px; background: var(--primary-dark); color: #fff; font-weight: 600; }
        .auth-card .toggle { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-muted); }
        .auth-card .toggle a { color: var(--primary); cursor: pointer; text-decoration: none; }
        .auth-card .error-msg { color: var(--danger); font-size: 13px; margin-bottom: 12px; text-align: center; display: none; }

        /* Main Layout */
        #main-view { display: none; height: 100vh; }
        .layout { display: flex; height: 100%; }
        .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .sidebar-header h3 { color: var(--primary); font-size: 16px; }
        .btn-new { background: var(--primary-dark); color: #fff; font-size: 13px; padding: 6px 12px; }
        .session-list { flex: 1; overflow-y: auto; padding: 8px; }
        .session-item { padding: 12px; border-radius: 8px; margin-bottom: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background .15s; }
        .session-item:hover { background: var(--surface2); }
        .session-item.active { background: var(--surface2); border-left: 3px solid var(--primary); }
        .session-item .title { font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .session-item .meta { font-size: 11px; color: var(--text-muted); }
        .session-item .del-btn { opacity: 0; color: var(--danger); font-size: 12px; background: transparent; padding: 4px 6px; }
        .session-item:hover .del-btn { opacity: 1; }
        .sidebar-footer { padding: 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }
        .sidebar-footer .status-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .sidebar-footer .logout-btn { width: 100%; margin-top: 8px; background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 6px; font-size: 12px; }

        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
        .chat-header .session-title { font-size: 14px; font-weight: 600; }
        .chat-header .model-badge { font-size: 12px; background: var(--surface2); padding: 4px 10px; border-radius: 12px; color: var(--primary); }
        .messages { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 16px; max-width: 85%; animation: fadeIn .2s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
        .msg.user { margin-left: auto; }
        .msg.user .bubble { background: var(--primary-dark); color: #fff; border-radius: 14px 14px 4px 14px; padding: 12px 16px; }
        .msg.assistant .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 14px 14px 14px 4px; padding: 12px 16px; }
        .msg .bubble { font-size: 14px; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap; }
        .msg .bubble code { background: rgba(79,195,247,.15); padding: 2px 5px; border-radius: 4px; font-size: 13px; }
        .msg .bubble pre { background: #0d1117; border-radius: 8px; padding: 12px; margin: 8px 0; overflow-x: auto; }
        .msg .bubble pre code { background: none; padding: 0; }
        .tool-block { margin: 8px 0; padding: 10px 14px; background: var(--tool-bg); border-radius: 8px; border-left: 3px solid var(--primary); font-size: 13px; }
        .tool-block .tool-header { font-weight: 600; color: var(--primary); margin-bottom: 4px; }
        .tool-block .tool-result { color: var(--text-muted); max-height: 120px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
        .tool-block.error { border-left-color: var(--danger); }
        .usage-info { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 8px; }

        /* Input Area */
        .input-area { padding: 16px 20px; border-top: 1px solid var(--border); background: var(--surface); }
        .input-row { display: flex; gap: 10px; align-items: flex-end; }
        .input-row textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 14px; background: var(--bg); color: var(--text); outline: none; min-height: 44px; max-height: 160px; line-height: 1.5; }
        .input-row textarea:focus { border-color: var(--primary); }
        .btn-send { background: var(--primary-dark); color: #fff; padding: 12px 20px; font-weight: 600; border-radius: 10px; }
        .btn-send:disabled { opacity: .4; cursor: not-allowed; }
        .btn-cancel { background: var(--danger); color: #fff; padding: 12px 16px; font-weight: 600; border-radius: 10px; display: none; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* Empty state */
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); }
        .empty-state h3 { font-size: 20px; margin-bottom: 8px; color: var(--primary); }
        .empty-state p { font-size: 14px; }

        /* Onboarding */
        #onboarding-view { display: none; align-items: center; justify-content: center; height: 100vh; }
        .onboarding-card { background: var(--surface); padding: 48px; border-radius: var(--radius); width: 520px; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
        .onboarding-card h2 { text-align: center; margin-bottom: 8px; color: var(--primary); font-size: 22px; }
        .onboarding-card .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }
        .onboarding-card .field { margin-bottom: 20px; }
        .onboarding-card .field label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-muted); }
        .onboarding-card .field .hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .onboarding-card .field input { width: 100%; }
        .onboarding-card .btn-primary { width: 100%; padding: 14px; background: var(--primary-dark); color: #fff; font-weight: 600; font-size: 15px; }
        .onboarding-card .error-msg { color: var(--danger); font-size: 13px; margin-bottom: 12px; text-align: center; display: none; }
        .onboarding-card .steps { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; }
        .onboarding-card .steps .step { width: 10px; height: 10px; border-radius: 50%; background: var(--border); transition: background .3s; }
        .onboarding-card .steps .step.active { background: var(--primary); }
        .onboarding-card .welcome-icon { text-align: center; font-size: 48px; margin-bottom: 16px; }
        .onboarding-card .skip-link { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-muted); cursor: pointer; }
        .onboarding-card .skip-link:hover { color: var(--primary); }
    </style>
</head>
<body>

<!-- Auth View -->
<div id="auth-view">
    <div class="auth-card">
        <h2 id="auth-title">登录</h2>
        <div class="error-msg" id="auth-error"></div>
        <div class="field">
            <label>用户名</label>
            <input type="text" id="auth-username" placeholder="请输入用户名" autocomplete="username">
        </div>
        <div class="field">
            <label>密码</label>
            <input type="password" id="auth-password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button class="btn-primary" id="auth-submit">登录</button>
        <div class="toggle">
            <span id="auth-toggle-text">还没有账号？</span>
            <a id="auth-toggle-link" onclick="toggleAuthMode()">去注册</a>
        </div>
    </div>
</div>

<!-- Onboarding View -->
<div id="onboarding-view">
    <div class="onboarding-card">
        <div class="welcome-icon">🚀</div>
        <h2>欢迎使用 JHarness2</h2>
        <p class="subtitle">完成以下配置，开启你的 AI Agent 之旅</p>
        <div class="steps">
            <div class="step active" id="step-1"></div>
            <div class="step" id="step-2"></div>
            <div class="step" id="step-3"></div>
        </div>
        <div class="error-msg" id="onboarding-error"></div>

        <!-- Step 1: Welcome -->
        <div id="onboarding-step-1">
            <div class="field">
                <label>显示名称</label>
                <input type="text" id="ob-display-name" placeholder="你希望怎么称呼你？">
                <div class="hint">可选，留空则使用用户名</div>
            </div>
            <button class="btn-primary" onclick="onboardingNext(2)">下一步 →</button>
        </div>

        <!-- Step 2: API Config -->
        <div id="onboarding-step-2" style="display:none;">
            <div class="field">
                <label>API Key *</label>
                <input type="text" id="ob-api-key" placeholder="输入你的 LLM API Key">
                <div class="hint">用于连接 AI 模型服务（如 OpenAI、Ollama 等）</div>
            </div>
            <div class="field">
                <label>LLM 服务地址</label>
                <input type="text" id="ob-base-url" placeholder="http://localhost:11434/v1">
                <div class="hint">可选，留空使用系统默认地址</div>
            </div>
            <button class="btn-primary" onclick="onboardingNext(3)">下一步 →</button>
        </div>

        <!-- Step 3: Model Selection -->
        <div id="onboarding-step-3" style="display:none;">
            <div class="field">
                <label>偏好模型</label>
                <input type="text" id="ob-model" placeholder="qwen3.5:4b">
                <div class="hint">可选，留空使用系统默认模型</div>
            </div>
            <button class="btn-primary" onclick="submitOnboarding()">完成配置 ✓</button>
        </div>

        <span class="skip-link" onclick="skipOnboarding()">跳过，稍后配置</span>
    </div>
</div>

<!-- Main View -->
<div id="main-view">
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>JHarness2</h3>
                <button class="btn-new" onclick="newSession()">+ 新对话</button>
            </div>
            <div class="session-list" id="session-list"></div>
            <div class="sidebar-footer">
                <div class="status-row"><span>引擎数</span><span id="stat-engines">-</span></div>
                <div class="status-row"><span>模型</span><span id="stat-model">-</span></div>
                <div class="status-row"><span>用户</span><span id="stat-user">-</span></div>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </aside>
        <main class="chat-area">
            <div class="chat-header">
                <span class="session-title" id="chat-title">新对话</span>
                <span class="model-badge" id="chat-model">-</span>
            </div>
            <div class="messages" id="messages">
                <div class="empty-state" id="empty-state">
                    <h3>🤖 JHarness2 AI Agent</h3>
                    <p>开始新的对话，我可以帮你完成各种任务</p>
                </div>
            </div>
            <div class="input-area">
                <div class="input-row">
                    <textarea id="msg-input" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
                    <button class="btn-send" id="btn-send" onclick="sendMessage()">发送</button>
                    <button class="btn-cancel" id="btn-cancel" onclick="cancelChat()">停止</button>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
// === State ===
let token = localStorage.getItem('jh2_token');
let username = localStorage.getItem('jh2_user');
let onboardingCompleted = localStorage.getItem('jh2_onboarding') === 'true';
let currentSessionId = null;
let isStreaming = false;
let isRegisterMode = false;
let eventSource = null;

// === Init ===
document.addEventListener('DOMContentLoaded', () => {
    if (token && username) {
        if (!onboardingCompleted) {
            showOnboardingView();
        } else {
            showMainView();
        }
    }
    setupInputAutoResize();
});

// === Auth ===
function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    document.getElementById('auth-title').textContent = isRegisterMode ? '注册' : '登录';
    document.getElementById('auth-submit').textContent = isRegisterMode ? '注册' : '登录';
    document.getElementById('auth-toggle-text').textContent = isRegisterMode ? '已有账号？' : '还没有账号？';
    document.getElementById('auth-toggle-link').textContent = isRegisterMode ? '去登录' : '去注册';
    hideAuthError();
}

document.getElementById('auth-submit').addEventListener('click', doAuth);
document.getElementById('auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });

async function doAuth() {
    const user = document.getElementById('auth-username').value.trim();
    const pass = document.getElementById('auth-password').value;
    if (!user || !pass) { showAuthError('请输入用户名和密码'); return; }

    const endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';
    try {
        const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json();
        if (!res.ok) { showAuthError(data.error || '操作失败'); return; }
        token = data.token;
        username = data.username;
        onboardingCompleted = data.onboardingCompleted;
        localStorage.setItem('jh2_token', token);
        localStorage.setItem('jh2_user', username);
        localStorage.setItem('jh2_onboarding', String(onboardingCompleted));
        if (!onboardingCompleted) {
            showOnboardingView();
        } else {
            showMainView();
        }
    } catch (e) { showAuthError('网络错误: ' + e.message); }
}

function showAuthError(msg) { const el = document.getElementById('auth-error'); el.textContent = msg; el.style.display = 'block'; }
function hideAuthError() { document.getElementById('auth-error').style.display = 'none'; }

function logout() {
    token = null; username = null; currentSessionId = null; onboardingCompleted = false;
    localStorage.removeItem('jh2_token');
    localStorage.removeItem('jh2_user');
    localStorage.removeItem('jh2_onboarding');
    document.getElementById('auth-view').style.display = 'flex';
    document.getElementById('main-view').style.display = 'none';
    document.getElementById('onboarding-view').style.display = 'none';
}

// === Onboarding ===
function showOnboardingView() {
    document.getElementById('auth-view').style.display = 'none';
    document.getElementById('main-view').style.display = 'none';
    document.getElementById('onboarding-view').style.display = 'flex';
}

function onboardingNext(step) {
    // Validate step 2 (API Key required)
    if (step === 3) {
        const apiKey = document.getElementById('ob-api-key').value.trim();
        if (!apiKey) { showOnboardingError('请输入 API Key'); return; }
    }
    hideOnboardingError();
    document.getElementById('onboarding-step-1').style.display = 'none';
    document.getElementById('onboarding-step-2').style.display = 'none';
    document.getElementById('onboarding-step-3').style.display = 'none';
    document.getElementById(`onboarding-step-${step}`).style.display = 'block';
    document.querySelectorAll('.onboarding-card .steps .step').forEach((el, i) => {
        el.classList.toggle('active', i < step);
    });
}

async function submitOnboarding() {
    const apiKey = document.getElementById('ob-api-key').value.trim();
    if (!apiKey) { showOnboardingError('请返回上一步填写 API Key'); return; }

    const payload = {
        displayName: document.getElementById('ob-display-name').value.trim() || null,
        apiKey: apiKey,
        baseUrl: document.getElementById('ob-base-url').value.trim() || null,
        preferredModel: document.getElementById('ob-model').value.trim() || null
    };

    try {
        const res = await apiFetch('/api/auth/onboarding', {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) { showOnboardingError(data.error || '配置失败'); return; }
        onboardingCompleted = true;
        localStorage.setItem('jh2_onboarding', 'true');
        showMainView();
    } catch (e) { showOnboardingError('网络错误: ' + e.message); }
}

function skipOnboarding() {
    // Skip with default config - still need API key for minimal setup
    const apiKey = document.getElementById('ob-api-key').value.trim();
    if (!apiKey) {
        // Use system default (ollama)
        submitOnboardingWithDefaults();
        return;
    }
    submitOnboarding();
}

async function submitOnboardingWithDefaults() {
    const payload = {
        apiKey: 'ollama',
        baseUrl: null,
        preferredModel: null,
        displayName: null
    };
    try {
        const res = await apiFetch('/api/auth/onboarding', {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        if (!res.ok) {
            const data = await res.json();
            showOnboardingError(data.error || '配置失败');
            return;
        }
        onboardingCompleted = true;
        localStorage.setItem('jh2_onboarding', 'true');
        showMainView();
    } catch (e) { showOnboardingError('网络错误: ' + e.message); }
}

function showOnboardingError(msg) {
    const el = document.getElementById('onboarding-error');
    el.textContent = msg;
    el.style.display = 'block';
}

function hideOnboardingError() {
    document.getElementById('onboarding-error').style.display = 'none';
}

// === Main View ===
function showMainView() {
    document.getElementById('auth-view').style.display = 'none';
    document.getElementById('onboarding-view').style.display = 'none';
    document.getElementById('main-view').style.display = 'block';
    document.getElementById('stat-user').textContent = username;
    loadSessions();
    loadSystemStatus();
}

// === Sessions ===
async function loadSessions() {
    try {
        const res = await apiFetch('/api/sessions');
        if (!res.ok) return;
        const sessions = await res.json();
        renderSessionList(sessions);
    } catch (e) { console.error('Load sessions failed', e); }
}

function renderSessionList(sessions) {
    const list = document.getElementById('session-list');
    if (!sessions.length) {
        list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">暂无历史会话</div>';
        return;
    }
    list.innerHTML = sessions.map(s => `
        <div class="session-item ${s.sessionId === currentSessionId ? 'active' : ''}" onclick="openSession('${s.sessionId}')">
            <div>
                <div class="title">${escapeHtml(s.title || s.sessionId)}</div>
                <div class="meta">${s.messageCount || 0} 条消息 · ${formatTime(s.updatedAt || s.createdAt)}</div>
            </div>
            <button class="del-btn" onclick="event.stopPropagation();deleteSession('${s.sessionId}')">✕</button>
        </div>
    `).join('');
}

async function newSession() {
    try {
        const res = await apiFetch('/api/chat/new', { method: 'POST' });
        if (!res.ok) return;
        const data = await res.json();
        currentSessionId = data.sessionId;
        clearMessages();
        document.getElementById('chat-title').textContent = '新对话';
        loadSessions();
    } catch (e) { console.error('New session failed', e); }
}

async function openSession(sessionId) {
    currentSessionId = sessionId;
    document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
    try {
        const res = await apiFetch(`/api/sessions/${sessionId}`);
        if (!res.ok) return;
        const data = await res.json();
        document.getElementById('chat-title').textContent = sessionId;
        document.getElementById('chat-model').textContent = data.model || '-';
        renderHistoryMessages(data.messages);
        loadSessions();
    } catch (e) { console.error('Open session failed', e); }
}

async function deleteSession(sessionId) {
    if (!confirm('确定删除此会话？')) return;
    try {
        await apiFetch(`/api/sessions/${sessionId}`, { method: 'DELETE' });
        if (currentSessionId === sessionId) { currentSessionId = null; clearMessages(); }
        loadSessions();
    } catch (e) { console.error('Delete session failed', e); }
}

function renderHistoryMessages(messagesJson) {
    const container = document.getElementById('messages');
    container.innerHTML = '';
    let messages = [];
    try { messages = typeof messagesJson === 'string' ? JSON.parse(messagesJson) : messagesJson; } catch (e) { return; }
    if (!messages || !messages.length) { container.innerHTML = emptyStateHtml(); return; }
    messages.forEach(msg => {
        if (msg.role === 'user') appendUserMessage(msg.content);
        else if (msg.role === 'assistant') appendAssistantMessage(msg.content);
    });
    scrollToBottom();
}

// === Chat ===
function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || isStreaming) return;

    if (!currentSessionId) { newSessionThenSend(text); return; }

    appendUserMessage(text);
    input.value = '';
    input.style.height = 'auto';
    startStreaming(text);
}

async function newSessionThenSend(text) {
    try {
        const res = await apiFetch('/api/chat/new', { method: 'POST' });
        if (!res.ok) return;
        const data = await res.json();
        currentSessionId = data.sessionId;
        document.getElementById('chat-title').textContent = currentSessionId;
        document.getElementById('msg-input').value = '';
        appendUserMessage(text);
        startStreaming(text);
    } catch (e) { console.error(e); }
}

function startStreaming(message) {
    isStreaming = true;
    updateSendButton();
    hideEmptyState();

    const assistantBubble = createAssistantBubble();
    let textContent = '';

    // Use fetch + ReadableStream for SSE with auth header
    fetch(`/api/chat/${currentSessionId}/message`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ message: message })
    }).then(response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        function pump() {
            return reader.read().then(({ done, value }) => {
                if (done) { finishStream(assistantBubble, textContent); return; }
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();
                for (const line of lines) {
                    if (line.startsWith('data:')) {
                        const jsonStr = line.substring(5).trim();
                        if (!jsonStr) continue;
                        try {
                            const evt = JSON.parse(jsonStr);
                            textContent = handleStreamEvent(evt, assistantBubble, textContent);
                        } catch (e) { /* skip non-json */ }
                    }
                }
                return pump();
            });
        }
        return pump();
    }).catch(err => {
        appendErrorInBubble(assistantBubble, err.message);
        finishStream(assistantBubble, textContent);
    });
}

function handleStreamEvent(evt, bubble, textContent) {
    switch (evt.type) {
        case 'text':
            textContent += evt.content;
            bubble.querySelector('.bubble-text').innerHTML = renderMarkdown(textContent);
            scrollToBottom();
            break;
        case 'tool_start':
            const toolBlock = document.createElement('div');
            toolBlock.className = 'tool-block';
            toolBlock.id = 'tool-' + (evt.toolId || Date.now());
            toolBlock.innerHTML = `<div class="tool-header">🔧 ${escapeHtml(evt.toolName)}</div><div class="tool-result">执行中...</div>`;
            bubble.appendChild(toolBlock);
            scrollToBottom();
            break;
        case 'tool_end':
            const existingBlock = bubble.querySelector('.tool-block:last-of-type');
            if (existingBlock) {
                if (evt.toolError) existingBlock.classList.add('error');
                const result = evt.toolResult || '';
                existingBlock.querySelector('.tool-result').textContent = result.length > 500 ? result.substring(0, 500) + '...' : result;
            }
            scrollToBottom();
            break;
        case 'usage':
            const usageEl = document.createElement('div');
            usageEl.className = 'usage-info';
            usageEl.textContent = `Token: ${evt.inputTokens || 0} in / ${evt.outputTokens || 0} out`;
            if (evt.costUsd) usageEl.textContent += ` · $${evt.costUsd.toFixed(4)}`;
            bubble.appendChild(usageEl);
            break;
        case 'error':
            appendErrorInBubble(bubble, evt.error);
            break;
        case 'done':
            break;
    }
    return textContent;
}

function finishStream(bubble, textContent) {
    isStreaming = false;
    updateSendButton();
    loadSessions();
}

async function cancelChat() {
    if (!currentSessionId) return;
    try { await apiFetch(`/api/chat/${currentSessionId}/cancel`, { method: 'POST' }); } catch (e) {}
    isStreaming = false;
    updateSendButton();
}

// === System Status ===
async function loadSystemStatus() {
    try {
        const res = await apiFetch('/api/system/status');
        if (!res.ok) return;
        const data = await res.json();
        document.getElementById('stat-engines').textContent = `${data.userEngines || 0}/${data.maxEnginesPerUser || 0}`;
        document.getElementById('stat-model').textContent = data.defaultModel || '-';
        document.getElementById('chat-model').textContent = data.defaultModel || '-';
    } catch (e) {}
}

// === UI Helpers ===
function appendUserMessage(text) {
    hideEmptyState();
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    container.appendChild(div);
    scrollToBottom();
}

function appendAssistantMessage(text) {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = `<div class="bubble">${renderMarkdown(text)}</div>`;
    container.appendChild(div);
    scrollToBottom();
}

function createAssistantBubble() {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = `<div class="bubble"><span class="bubble-text"></span></div>`;
    container.appendChild(div);
    scrollToBottom();
    return div;
}

function appendErrorInBubble(bubble, msg) {
    const errEl = document.createElement('div');
    errEl.style.cssText = 'color: var(--danger); font-size: 13px; margin-top: 8px;';
    errEl.textContent = '⚠️ ' + msg;
    bubble.appendChild(errEl);
}

function clearMessages() {
    document.getElementById('messages').innerHTML = emptyStateHtml();
}

function hideEmptyState() {
    const el = document.getElementById('empty-state');
    if (el) el.remove();
}

function emptyStateHtml() {
    return '<div class="empty-state" id="empty-state"><h3>🤖 JHarness2 AI Agent</h3><p>开始新的对话，我可以帮你完成各种任务</p></div>';
}

function updateSendButton() {
    document.getElementById('btn-send').style.display = isStreaming ? 'none' : 'block';
    document.getElementById('btn-cancel').style.display = isStreaming ? 'block' : 'none';
}

function scrollToBottom() {
    const el = document.getElementById('messages');
    el.scrollTop = el.scrollHeight;
}

function setupInputAutoResize() {
    const textarea = document.getElementById('msg-input');
    textarea.addEventListener('input', () => {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
    });
    textarea.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
}

// === Utilities ===
function apiFetch(url, options = {}) {
    options.headers = { ...options.headers, 'Authorization': 'Bearer ' + token };
    if (!options.headers['Content-Type'] && options.method && options.method !== 'GET') {
        options.headers['Content-Type'] = 'application/json';
    }
    return fetch(url, options).then(res => {
        if (res.status === 401) { logout(); throw new Error('Unauthorized'); }
        return res;
    });
}

function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
}

function renderMarkdown(text) {
    if (!text) return '';
    let html = escapeHtml(text);
    // code blocks
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
    // inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    // bold
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // newlines
    html = html.replace(/\n/g, '<br>');
    return html;
}

function formatTime(isoStr) {
    if (!isoStr) return '';
    const d = new Date(isoStr);
    const now = new Date();
    if (d.toDateString() === now.toDateString()) {
        return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }
    return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
}
