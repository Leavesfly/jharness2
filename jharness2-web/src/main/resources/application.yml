server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: jharness2
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:h2:file:./data/jharness2-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      # 默认关闭：H2 控制台无需认证即可操作整库，仅本地调试时临时开启
      enabled: false
      path: /h2-console
  sql:
    init:
      mode: always
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# JHarness2 配置
jharness2:
  engine:
    default-model: qwen3.5:4b
    default-base-url: http://localhost:11434/v1
    default-api-key: ollama
    max-tokens: 4096
    max-turns: 12
    connect-timeout-seconds: 30
    read-timeout-seconds: 300
    write-timeout-seconds: 30
    max-engines-per-user: 5
    max-total-engines: 200
    engine-idle-timeout-minutes: 30
    tools:
      # bash 在宿主机以应用进程身份执行；多用户部署且无容器级隔离时建议置为 false
      bash-enabled: true
    denied-command-patterns:
      - "rm -rf /*"
      - "sudo *"
      - "shutdown*"
      - "reboot*"
      - "mkfs*"
      - "dd if=*"
    distributed:
      enabled: false
      node-id: ""
      state-sync-interval-seconds: 10
      ownership-lease-seconds: 60
      state-ttl-minutes: 35
      # 本节点对其他节点可达的地址（如 http://10.0.0.1:8080）。
      # 配置后开启节点间请求转发：非属主节点收到会话请求时 SSE 透传到属主节点；
      # 留空则不参与转发（退回 409，需在 LB 层配置会话亲和路由）
      advertise-address: ${NODE_ADVERTISE_ADDRESS:}

  workspace:
    root: ./data/workspaces
    storage-type: local  # local | oss
    oss:
      endpoint: ""
      access-key-id: ""
      access-key-secret: ""
      bucket-name: ""
      key-prefix: workspaces/
      local-cache-dir: ./data/workspace-cache
      sync-interval-seconds: 30
      delete-local-cache-on-release: false

  security:
    jwt:
      # 未配置时启动时生成临时随机密钥（重启后旧 token 失效）；生产必须注入 JWT_SECRET
      secret: ${JWT_SECRET:}
      expiration-ms: 86400000
    # 首次启动创建 admin 账号的密码；缺失时生成一次性随机密码并打印到日志
    admin-password: ${ADMIN_PASSWORD:}
    cors:
      # 逗号分隔的允许源；空值 = 不开放跨域
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  # 每用户请求限流（进程内）
  ratelimit:
    enabled: true
    requests-per-minute: 30

  chat:
    # SSE 连接超时（毫秒）
    sse-timeout-ms: 1800000
    # 客户端断线后的宽限期（毫秒）：期内任务跑完正常落库（刷新页面可见结果），
    # 到期仍未完成才取消；置 0 恢复"断线立即取消"的旧行为
    disconnect-grace-ms: 300000

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    io.leavesfly.jharness2: INFO
    org.springframework.security: WARN
