spring:
  datasource:
    url: jdbc:mysql://localhost:3306/jharness2?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:jharness2}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate

jharness2:
  engine:
    default-model: ${LLM_MODEL:deepseek-chat}
    default-base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
    default-api-key: ${LLM_API_KEY:}
    max-total-engines: 500
    engine-idle-timeout-minutes: 15

  workspace:
    root: ${WORKSPACE_ROOT:/data/jharness2/workspaces}

  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 43200000

logging:
  level:
    io.leavesfly.jharness2: INFO
    org.springframework: WARN
